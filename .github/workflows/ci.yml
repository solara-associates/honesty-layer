name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (lockfile-pinned)
        run: npm ci

      - name: Build all packages
        run: npm run build --workspaces --if-present

      - name: Test all packages
        run: npm run test --workspaces --if-present

      - name: Dependency vulnerability scan (A7.supply-chain)
        run: npm audit --audit-level=high

      - name: Generate SBOM (A7.supply-chain)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Lint / layer boundaries (A3)
        run: npm run lint
